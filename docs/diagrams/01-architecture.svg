<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI,system-ui,sans-serif">
  <style>
    .lyr{fill:#F7FAF8;stroke:#E4EAE6;stroke-width:1}
    .lbl{font-size:10px;fill:#6B7B74;letter-spacing:.08em;font-weight:600}
    .box{fill:#fff;stroke:#CBD6CF;stroke-width:1.2;rx:6}
    .pure{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1.4}
    .t{font-size:12px;fill:#0F1D18;font-weight:600}
    .s{font-size:9.5px;fill:#6B7B74}
    .a{stroke:#8A968F;stroke-width:1.3;fill:none;marker-end:url(#ah)}
    .ap{stroke:#0F6E56;stroke-width:1.5;fill:none;marker-end:url(#ag)}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8A968F"/></marker>
    <marker id="ag" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#0F6E56"/></marker>
  </defs>

  <rect class="lyr" x="10" y="10" width="740" height="86" rx="7"/>
  <text class="lbl" x="22" y="28">INTERFACE — HTTP AND THE BROWSER</text>
  <rect class="box" x="30" y="36" width="330" height="48" rx="6"/>
  <text class="t" x="44" y="55">routers/</text>
  <text class="s" x="44" y="70">auth · reports · incidents · attachments · corridors · admin</text>
  <rect class="box" x="380" y="36" width="350" height="48" rx="6"/>
  <text class="t" x="394" y="55">web/app/</text>
  <text class="s" x="394" y="70">ES modules, service worker, offline queue</text>

  <rect class="lyr" x="10" y="118" width="740" height="86" rx="7"/>
  <text class="lbl" x="22" y="136">APPLICATION — USE CASES, ORCHESTRATION</text>
  <rect class="box" x="30" y="144" width="440" height="48" rx="6"/>
  <text class="t" x="44" y="163">services/</text>
  <text class="s" x="44" y="178">reports · projection · advisory · dispatch · attachments · staleness</text>
  <rect class="box" x="490" y="144" width="240" height="48" rx="6"/>
  <text class="t" x="504" y="163">worker.py</text>
  <text class="s" x="504" y="178">the outbox drain loop</text>

  <rect class="lyr" x="10" y="226" width="740" height="92" rx="7"/>
  <text class="lbl" x="22" y="244">DOMAIN — PURE DECISIONS, NO DATABASE, CLOCK OR NETWORK</text>
  <rect class="pure" x="30" y="252" width="132" height="52" rx="6"/>
  <text class="t" x="44" y="273">clustering.py</text><text class="s" x="44" y="290">grouping</text>
  <rect class="pure" x="172" y="252" width="132" height="52" rx="6"/>
  <text class="t" x="186" y="273">confidence.py</text><text class="s" x="186" y="290">scoring, decay</text>
  <rect class="pure" x="314" y="252" width="132" height="52" rx="6"/>
  <text class="t" x="328" y="273">lifecycle.py</text><text class="s" x="328" y="290">state machine</text>
  <rect class="pure" x="456" y="252" width="132" height="52" rx="6"/>
  <text class="t" x="470" y="273">reputation.py</text><text class="s" x="470" y="290">beta posterior</text>
  <rect class="pure" x="598" y="252" width="132" height="52" rx="6"/>
  <text class="t" x="612" y="273">circuit_breaker</text><text class="s" x="612" y="290">3 states</text>

  <rect class="lyr" x="10" y="340" width="740" height="86" rx="7"/>
  <text class="lbl" x="22" y="358">INFRASTRUCTURE</text>
  <rect class="box" x="30" y="366" width="230" height="48" rx="6"/>
  <text class="t" x="44" y="385">models.py</text><text class="s" x="44" y="400">SQLAlchemy</text>
  <rect class="box" x="280" y="366" width="230" height="48" rx="6"/>
  <text class="t" x="294" y="385">PostgreSQL + PostGIS</text><text class="s" x="294" y="400">geography, GiST</text>
  <rect class="box" x="530" y="366" width="200" height="48" rx="6"/>
  <text class="t" x="544" y="385">gateway.py</text><text class="s" x="544" y="400">outbound delivery</text>

  <path class="a" d="M195 84 L195 144"/>
  <path class="a" d="M600 84 L200 140" stroke-dasharray="3 3"/>
  <path class="a" d="M600 84 L600 144"/>
  <path class="ap" d="M120 192 L96 252"/>
  <path class="ap" d="M240 192 L238 252"/>
  <path class="ap" d="M340 192 L380 252"/>
  <path class="ap" d="M420 192 L522 252"/>
  <path class="a" d="M610 192 L664 252"/>
  <path class="a" d="M150 304 L150 366"/>
  <path class="a" d="M664 304 L630 366"/>
  <path class="a" d="M145 414 L280 392"/>

  <text class="s" x="612" y="112" font-style="italic">fetch, JSON</text>
  <text class="s" x="22" y="446" fill="#0F6E56" font-weight="600">The rule: the domain layer imports nothing from the layers above it — which is what makes 1,000 generated test cases affordable.</text>
</svg>
