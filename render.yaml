# Render blueprint.
#
# One service only. Render's free tier permits a single service, which is why the
# outbox worker runs in-process as an asyncio task rather than as a separate worker
# — see decision D-013.
#
# To use: push this repository to GitHub, then in Render choose
# "New +" -> "Blueprint" and point it at the repo.

services:
  - type: web
    name: nkwanta
    runtime: python
    plan: free
    region: frankfurt          # closest available region to Ghana
    branch: main
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"

      - key: ENVIRONMENT
        value: production

      # Set by hand in the Render dashboard. `sync: false` means "this blueprint
      # declares the variable but deliberately does not carry its value", so the
      # connection string is never committed to the repository.
      - key: DATABASE_URL
        sync: false

      # Render generates a strong random value on first deploy and keeps it stable
      # afterwards. Better than a human-chosen secret, and one less manual step.
      # app/main.py refuses to start in production if this is still the default.
      - key: JWT_SECRET
        generateValue: true

      # Clustering parameters. Environment variables so they can be tuned without a
      # redeploy — see technical debt TD-03, the highest-priority item on the register.
      - key: CLUSTER_RADIUS_METRES
        value: "300"
      - key: CLUSTER_WINDOW_MINUTES
        value: "30"
      - key: CONFIDENCE_HALF_LIFE_MINUTES
        value: "45"
