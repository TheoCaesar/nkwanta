[pytest]
testpaths = tests
asyncio_mode = auto
addopts = -q --strict-markers

# Put the project root on sys.path so `from app... import ...` resolves.
#
# Without this, `python -m pytest` works (Python puts the current directory on
# sys.path) but the bare `pytest` console script fails with
# ModuleNotFoundError: No module named 'app'. Setting it here makes both work.
pythonpath = .

filterwarnings =
    ignore::DeprecationWarning
    # starlette 1.6 nudges towards httpx2; the TestClient works correctly as is.
    ignore::UserWarning:starlette.*
